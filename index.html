<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Epic Arcade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            background: #1f2937;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #374151;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        header p {
            color: #9ca3af;
        }

        .search {
            width: 90%;
            max-width: 600px;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .game {
            background: #1f2937;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #374151;
        }

        .game:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
        }

        .game-image {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: #374151;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h2 {
            margin: 0 0 5px;
            font-size: 20px;
        }

        .game-info p {
            margin: 0;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 Epic Arcade</h1>
    <p>Play browser games!</p>

    <input
        class="search"
        type="text"
        id="search"
        placeholder="Search games..."
        onkeyup="searchGames()"
    >
</header>

<div class="games" id="games">

    <div class="game" onclick="openGame('Basketball')">
        <div class="game-image">🏀</div>
        <div class="game-info">
            <h2>Basketball</h2>
            <p>Sports</p>
        </div>
    </div>

    <div class="game" onclick="openGame('Racing')">
        <div class="game-image">🏎️</div>
        <div class="game-info">
            <h2>Racing</h2>
            <p>Racing</p>
        </div>
    </div>

    <div class="game" onclick="openGame('Puzzle')">
        <div class="game-image">🧩</div>
        <div class="game-info">
            <h2>Puzzle</h2>
            <p>Puzzle</p>
        </div>
    </div>

    <div class="game" onclick="openGame('Zombie')">
        <div class="game-image">🧟</div>
        <div class="game-info">
            <h2>Zombie</h2>
            <p>Action</p>
        </div>
    </div>

    <div class="game" onclick="openGame('Runner')">
        <div class="game-image">🏃</div>
        <div class="game-info">
            <h2>Runner</h2>
            <p>Arcade</p>
        </div>
    </div>

    <div class="game" onclick="openGame('Adventure')">
        <div class="game-image">🏰</div>
        <div class="game-info">
            <h2>Adventure</h2>
            <p>Adventure</p>
        </div>
    </div>

</div>

<script>

function openGame(game) {
    alert(game + " will go here!");
}

function searchGames() {

    let search = document
        .getElementById("search")
        .value
        .toLowerCase();

    let games = document.querySelectorAll(".game");

    games.forEach(function(game) {

        let name = game
            .querySelector("h2")
            .textContent
            .toLowerCase();

        if (name.includes(search)) {
            game.style.display = "block";
        } else {
            game.style.display = "none";
        }

    });
}

</script>

</body>
</html>
